server:
  port: 8081

spring:
  application:
    name: office-inventory-mgmt

  # File-based H2 DB -> creates ./data/inventory.mv.db relative to where the app runs
  datasource:
    url: jdbc:h2:file:./data/inventory;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Change this before any real deployment. 256-bit+ secret for HS256.
    secret: "office-inventory-mgmt-dev-secret-key-change-me-please-1234567890"
    expiration-ms: 86400000 # 24h

  cors:
    allowed-origins: "http://localhost:5174"
